# Edge for the whole stack: serves the web app (checkout + merchant
# dashboard) on :80 and the admin console on :8080, and proxies /v1 on both to
# the api. The api sends no CORS headers, so the browser apps must reach it on
# their own origin; this is that origin.
#
# Load shedding happens here, in front of Node: at most API_INFLIGHT requests
# are proxied at once, and the rest get an immediate JSON 503 with
# Retry-After. Refusing them inside the api's half vCPU cost enough CPU to
# starve the requests it had already admitted.

# One global counter (a constant key), not per client IP: a load test or a
# busy NAT comes from one address and must not be throttled as a single user.
map $host $api_all {
    default all;
}
limit_conn_zone $api_all zone=api_inflight:1m;

upstream api {
    server api:3000;
    keepalive 32;
}

server {
    listen 80;
    root /srv/web;

    include /etc/nginx/conf.d/api-proxy.inc;

    location / {
        try_files $uri /index.html;
    }
}

server {
    listen 8080;
    root /srv/admin;

    include /etc/nginx/conf.d/api-proxy.inc;

    location / {
        try_files $uri /index.html;
    }
}
